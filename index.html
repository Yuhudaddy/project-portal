<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="施工管理記錄工具入口" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'" />
    <meta name="theme-color" content="#eef0f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="施工記錄工具" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./portal.css" />
    <title>施工記錄工具｜Project Portal</title>
  </head>
  <body>
    <a class="skip-link" href="#tool-index">跳至工程工具</a>

    <header class="portal-header">
      <div class="portal-header-inner">
        <a class="brand" href="./" aria-label="回到施工記錄工具入口">
          <img src="./icon.svg" alt="" width="34" height="34" />
          <span>施工記錄工具</span>
        </a>
        <span class="header-tag">FIELD RECORDS</span>
      </div>
    </header>

    <main class="portal-shell" id="tool-index">
      <section class="portal-intro" aria-labelledby="portal-title">
        <p class="eyebrow">PROJECT PORTAL / TOOL INDEX</p>
        <h1 id="portal-title">選擇工程記錄</h1>
        <p class="intro-copy">選擇要填寫的工程類別，進入對應的現場記錄工具。</p>
      </section>

      <section class="tool-index" aria-label="工程記錄工具">
        <a class="tool-card tool-card-active" href="./diaphragm-wall.html">
          <span class="tool-index-no">01</span>
          <span class="tool-card-copy">
            <strong>連續壁</strong>
            <small>Diaphragm Wall｜施工紀錄、品質自檢與複核表</small>
          </span>
        </a>

        <a class="tool-card tool-card-active" href="./template.html" aria-label="開啟模板工程施工複核">
          <span class="tool-index-no">02</span>
          <span class="tool-card-copy">
            <strong>模板</strong>
            <small>Formwork｜施工複核與放行紀錄</small>
          </span>
        </a>

        <a class="tool-card tool-card-coming" href="./rebar.html" aria-label="鋼筋，尚未開放">
          <span class="tool-index-no">03</span>
          <span class="tool-card-copy">
            <strong>鋼筋</strong>
            <small>尚未開放</small>
          </span>
          <span class="tool-status">404</span>
        </a>

        <a class="tool-card tool-card-coming" href="./steel-structure.html" aria-label="鋼構，尚未開放">
          <span class="tool-index-no">04</span>
          <span class="tool-card-copy">
            <strong>鋼構</strong>
            <small>尚未開放</small>
          </span>
          <span class="tool-status">404</span>
        </a>

        <a class="tool-card tool-card-coming" href="./scaffold.html" aria-label="施工架，尚未開放">
          <span class="tool-index-no">05</span>
          <span class="tool-card-copy">
            <strong>施工架</strong>
            <small>尚未開放</small>
          </span>
          <span class="tool-status">404</span>
        </a>
      </section>

      <footer class="portal-footer">
        <span>現場填寫・單次輸出・不保存資料</span>
        <span>Project Portal</span>
      </footer>
    </main>
  </body>
</html>
